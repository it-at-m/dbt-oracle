name: build-postgres

on:
  push:

  schedule:
    - cron: "30 2 * * *" # run at 2:30 AM UTC

  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        description: semver - Version of dbt-postgres the image will use. Also the new Version Tag of this image.
        default: ""

env:
  DEV_TAG: untested
  DBT_POSTGRES_VERSION: ${{ github.event.inputs.version == '' && ' ' ||  format('=={0}', github.event.inputs.version) }}
  IMAGE_REPO: ghcr.io/it-at-m/dbt-postgres

jobs:
  # Build a Version of the image tage with 'untested'.
  build-and-push-untested-image-to-ghcr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=${{ env.DEV_TAG }}

      - name: Build and push untested Docker image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max
          build-args: |
            DBT_POSTGRES_VERSION=${{ env.DBT_POSTGRES_VERSION }}

    outputs:
      imagename: ${{ steps.meta.outputs.tags }}

  # Use the Image taged with 'untested' and run it agains a postgresxe servicecontainer to check if everything is working
  test-untested-image:
    needs: build-and-push-untested-image-to-ghcr
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-and-push-untested-image-to-ghcr.outputs.imagename }}

    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test image - dbt debug against postgres db
        run: |
          dbt --version
          cd test
          dbt debug --profiles-dir=../postgres/test

  # If the test was positive we rebuild the Image from cache and publish it to GHCR and Dockerhub
  publish-tested-image:
    needs: test-untested-image
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Publish
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=schedule,pattern=nightly,enable=${{ github.event_name == 'schedule' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DBT_POSTGRES_VERSION=${{ env.DBT_POSTGRES_VERSION }}
